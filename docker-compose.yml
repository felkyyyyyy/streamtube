services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamtube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamtube_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-streamtube}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamtube} -d ${POSTGRES_DB:-streamtube}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streamtube_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streamtube_minio_change_me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-streamtube}:${POSTGRES_PASSWORD:-streamtube_change_me}@postgres:5432/${POSTGRES_DB:-streamtube}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-streamtube_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-streamtube_minio_change_me}
      S3_BUCKET: ${S3_BUCKET:-streamtube-media}
      ENABLE_BACKGROUND_WORKER: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker.transcoder"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-streamtube}:${POSTGRES_PASSWORD:-streamtube_change_me}@postgres:5432/${POSTGRES_DB:-streamtube}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-streamtube_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-streamtube_minio_change_me}
      S3_BUCKET: ${S3_BUCKET:-streamtube-media}
      ENABLE_BACKGROUND_WORKER: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
